name: Daily Rashifal Reels
on:
  schedule:
    - cron: "30 23 * * *"     # 05:00 IST every day
  workflow_dispatch:
    inputs:
      date: { description: "YYYY-MM-DD (blank = today IST)", required: false }
      dry_run: { description: "1 = render and upload only, do not post", required: false, default: "0" }

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_KEY: ${{ secrets.S3_KEY }}
      S3_SECRET: ${{ secrets.S3_SECRET }}
      PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
      GAP_MINUTES: "20"
      DRY_RUN: ${{ github.event.inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: System packages (emoji font + Chrome libs)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-color-emoji ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2
      - run: pip install -r requirements.txt
      - run: npm ci
        working-directory: remotion
      - name: Pick date
        run: echo "RDATE=${{ github.event.inputs.date || '' }}" >> $GITHUB_ENV
      - name: Resolve date
        run: |
          if [ -z "$RDATE" ]; then echo "RDATE=$(TZ=Asia/Kolkata date +%F)" >> $GITHUB_ENV; fi
      - name: Generate panchang + rashifal
        run: python pipeline/generate.py "$RDATE"
      - name: Render 12 reels
        run: node render.mjs "$RDATE"
        working-directory: remotion
      - name: Upload and publish
        run: python pipeline/publish.py "$RDATE"
      - name: Save history (avoids repeated tips)
        if: success()
        run: |
          git config user.name "rashifal-bot" && git config user.email "bot@users.noreply.github.com"
          git add history/last.json && (git commit -m "history $RDATE" && git push) || true
      - name: Alert on failure
        if: failure()
        run: |
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" -d text="❌ Rashifal workflow failed. Check GitHub Actions logs." || true
