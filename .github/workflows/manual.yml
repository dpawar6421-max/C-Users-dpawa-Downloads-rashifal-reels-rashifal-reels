name: Rashifal Reels (from pasted file)
on:
  push:
    paths: ["content/today.json"]
  workflow_dispatch:
    inputs:
      dry_run: { description: "1 = render and upload only, do not post", required: false, default: "0" }

permissions:
  contents: read

concurrency:
  group: rashifal
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_KEY: ${{ secrets.S3_KEY }}
      S3_SECRET: ${{ secrets.S3_SECRET }}
      PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
      GAP_MINUTES: "20"
      DRY_RUN: ${{ github.event.inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: System packages (emoji font + Chrome libs)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-color-emoji ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2
      - run: pip install -r requirements.txt
      - run: npm install
        working-directory: remotion
      - name: Check pasted file and build captions
        run: python pipeline/ingest.py
      - name: Render 12 reels
        run: node render.mjs "$RDATE"
        working-directory: remotion
      - name: Save reels so you can download and check them
        uses: actions/upload-artifact@v4
        with:
          name: reels
          path: out/**/*.mp4
      - name: Upload and publish
        if: github.event.inputs.dry_run != '1'
        run: python pipeline/publish.py "$RDATE"
      - name: Alert on failure
        if: failure()
        run: |
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" -d text="❌ Rashifal workflow failed. Check GitHub Actions logs." || true
